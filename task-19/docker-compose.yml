networks:
  super30-app-network:
    driver: bridge

volumes:
  postgres_data:

services:
  db:
    image: postgres:16-alpine
    container_name: super30_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-super30_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - super30-app-network
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: super30_backend_api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-adminpassword}@db:5432/${POSTGRES_DB:-super30_db}
    networks:
      - super30-app-network
    ports:
      - "8000:8000"
    depends_on:
      - db
